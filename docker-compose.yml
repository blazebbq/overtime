version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitfinish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitfinish
      POSTGRES_PASSWORD: fitfinish_dev_password
      POSTGRES_DB: fitfinish
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitfinish"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
